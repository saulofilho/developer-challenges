require:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  DisplayCopNames: true
  DisplayStyleGuide: true
  ExtraDetails: false
  NewCops: enable
  TargetRubyVersion: 3.2.2

Metrics/BlockLength:
  IgnoredMethods: ['describe']
  Max: 50

RSpec/EmptyExampleGroup:
  Enabled: false

RSpec/ImplicitExpect:
  Enabled: false

Style/Documentation:
  Enabled: false

RSpec/ScatteredSetup:
  Enabled: false
